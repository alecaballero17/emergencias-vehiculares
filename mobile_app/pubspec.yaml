name: mobile_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  
  # API & State
  dio: ^5.4.3+1
  provider: ^6.1.1
  shared_preferences: ^2.2.3
  jwt_decoder: ^2.0.1

  # SOS Features
  geolocator: ^11.0.0
  image_picker: ^1.1.2
  record: ^5.0.1
  path_provider: ^2.1.3
  audioplayers: ^6.0.0

  # UI & Design
  google_fonts: ^6.2.1
  animate_do: ^3.3.4
  intl: ^0.19.0

  # Payments
  qr_flutter: ^4.1.0
  flutter_credit_card: ^4.0.1

  # Notifications
  flutter_local_notifications: ^17.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
