<div class="register-container">
  <div class="login-bg">
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
  </div>

  <div class="register-card">
    <div class="register-header">
      <div class="logo-icon">🔧</div>
      <h1>Registrar Taller</h1>
      <p>Crea tu cuenta para recibir solicitudes de servicio</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="register-form">
      @if (error) {
        <div class="error-alert">
          <span>⚠️</span>
          <span>{{ error }}</span>
        </div>
      }

      @if (success) {
        <div class="success-alert">
          <span>✅</span>
          <span>{{ success }}</span>
        </div>
      }

      <div class="form-group">
        <label for="name">Nombre del Taller</label>
        <input id="name" type="text" formControlName="name" class="form-input" placeholder="Nombre de tu taller mecánico" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="address">Dirección del Taller</label>
          <input id="address" type="text" formControlName="address" class="form-input" placeholder="Ej. Av. Banzer 4to Anillo" />
        </div>
        <div class="form-group">
          <label for="tenant_id">Red de Talleres (Tenant)</label>
          <select id="tenant_id" formControlName="tenant_id" class="form-input">
            <option value="" disabled selected>Selecciona una red...</option>
            @for (t of tenants; track t.id) {
              <option [value]="t.id">{{ t.name }}</option>
            }
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" formControlName="email" class="form-input" placeholder="correo@ejemplo.com" />
        </div>
        <div class="form-group">
          <label for="phone">Teléfono</label>
          <input id="phone" type="text" formControlName="phone" class="form-input" placeholder="+591 7XXXXXXX" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" type="password" formControlName="password" class="form-input" placeholder="Mínimo 6 caracteres" />
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirmar</label>
          <input id="confirmPassword" type="password" formControlName="confirmPassword" class="form-input" placeholder="Repetir contraseña" />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg register-btn" [disabled]="loading || form.invalid">
        @if (loading) {
          <span class="spinner"></span>
          <span>Registrando...</span>
        } @else {
          <span>Crear Cuenta</span>
          <span>→</span>
        }
      </button>
    </form>

    <div class="register-footer">
      <span>¿Ya tienes cuenta?</span>
      <a routerLink="/login" class="login-link">Iniciar Sesión</a>
    </div>
  </div>
</div>
