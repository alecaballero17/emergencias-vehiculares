<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <div class="logo">🚗</div>
      <h1>Emergencias Vehiculares</h1>
      <p>Crear cuenta de cliente</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      @if (error) {
        <div class="alert alert-error">{{ error }}</div>
      }
      @if (success) {
        <div class="alert alert-success">{{ success }}</div>
      }

      <div class="form-group">
        <label for="full_name">Nombre completo</label>
        <input id="full_name" type="text" formControlName="full_name" placeholder="Juan Pérez">
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" formControlName="email" placeholder="correo@ejemplo.com">
      </div>

      <div class="form-group">
        <label for="phone">Teléfono</label>
        <input id="phone" type="tel" formControlName="phone" placeholder="+591 70000000">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" type="password" formControlName="password" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirmar contraseña</label>
          <input id="confirmPassword" type="password" formControlName="confirmPassword" placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="form.invalid || loading">
        @if (loading) {
          <span class="spinner"></span> Registrando...
        } @else {
          Crear cuenta
        }
      </button>

      <div class="login-link">
        ¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a>
      </div>
    </form>
  </div>
</div>
