<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">🚗</div>
      <h1>Emergencias Vehiculares</h1>
      <p>Panel de Talleres</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      @if (error) {
        <div class="alert alert-error">{{ error }}</div>
      }

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" formControlName="email" placeholder="taller@ejemplo.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="form.invalid || loading">
        @if (loading) {
          <span class="spinner"></span> Ingresando...
        } @else {
          Iniciar Sesión
        }
      </button>

      <div class="register-link">
        ¿No tienes cuenta? <a routerLink="/register">Crear cuenta</a>
      </div>
    </form>
  </div>
</div>
