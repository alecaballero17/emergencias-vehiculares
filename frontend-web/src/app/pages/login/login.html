<div class="login-container">
  <div class="login-bg">
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
  </div>

  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon">🚗</div>
      <h1>Emergencias Vehiculares</h1>
      <p>Panel de Administración de Talleres</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
      @if (error) {
        <div class="error-alert">
          <span class="error-icon">⚠️</span>
          <span>{{ error }}</span>
        </div>
      }

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="form-input"
          placeholder="taller@ejemplo.com"
          [class.invalid]="form.get('email')?.touched && form.get('email')?.invalid"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="form-input"
          placeholder="••••••••"
          [class.invalid]="form.get('password')?.touched && form.get('password')?.invalid"
        />
      </div>

      <button type="submit" class="btn btn-primary btn-lg login-btn" [disabled]="loading || form.invalid">
        @if (loading) {
          <span class="spinner"></span>
          <span>Ingresando...</span>
        } @else {
          <span>Iniciar Sesión</span>
          <span>→</span>
        }
      </button>
    </form>

    <div class="login-footer">
      <span>¿No tienes cuenta?</span>
      <a routerLink="/register" class="register-link">Registrar Taller</a>
    </div>
  </div>
</div>
